<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#14181f;font-size:19px;font-weight:700}
    .sub{fill:#565e6c;font-size:12.5px}
    .lbl{fill:#14181f;font-size:12.5px;font-weight:600}
    .note{fill:#565e6c;font-size:11px}
    .task{fill:#e5f0f1;stroke:#1f5f6b;stroke-width:1.5}
    .taskLow{fill:#f7f8fa;stroke:#565e6c;stroke-width:1.5}
    .q{fill:#dfe3e8;stroke:#14181f;stroke-width:1.5}
    .arrow{stroke:#1f5f6b;stroke-width:2;fill:none;marker-end:url(#a3)}
  </style>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f5f6b"/></marker>
  </defs>
  <rect class="bg" width="800" height="460"/>
  <text class="title" x="20" y="30">FreeRTOS Task Architecture: Priorities, a Queue, and a Mutex</text>
  <text class="sub" x="20" y="48">Typical sensor-to-cloud pipeline on an embedded MCU</text>

  <!-- priority axis -->
  <line x1="60" y1="80" x2="60" y2="380" stroke="#565e6c" stroke-width="1"/>
  <text class="note" x="55" y="90" text-anchor="end">High</text>
  <text class="note" x="55" y="375" text-anchor="end">Low</text>
  <text class="note" x="30" y="230" text-anchor="middle" transform="rotate(-90 30 230)">Priority</text>

  <!-- tasks -->
  <rect class="task" x="90" y="90" width="180" height="55"/>
  <text class="lbl" x="180" y="112" text-anchor="middle">ISR: Sensor DMA</text>
  <text class="note" x="180" y="130" text-anchor="middle">priority: interrupt (highest)</text>

  <rect class="task" x="90" y="170" width="180" height="55"/>
  <text class="lbl" x="180" y="192" text-anchor="middle">Task: Sensor Fusion</text>
  <text class="note" x="180" y="210" text-anchor="middle">priority 4, hard real-time</text>

  <rect class="taskLow" x="90" y="250" width="180" height="55"/>
  <text class="lbl" x="180" y="272" text-anchor="middle">Task: Network / MQTT</text>
  <text class="note" x="180" y="290" text-anchor="middle">priority 2, best-effort</text>

  <rect class="taskLow" x="90" y="330" width="180" height="55"/>
  <text class="lbl" x="180" y="352" text-anchor="middle">Task: UI / Idle Hook</text>
  <text class="note" x="180" y="370" text-anchor="middle">priority 1, lowest</text>

  <!-- queue -->
  <rect class="q" x="340" y="178" width="120" height="40"/>
  <text class="note" x="400" y="202" text-anchor="middle">Queue</text>
  <path class="arrow" d="M270 197 H340"/>
  <path class="arrow" d="M460 197 H520"/>

  <rect class="taskLow" x="520" y="170" width="180" height="55"/>
  <text class="lbl" x="610" y="192" text-anchor="middle">Consumer Task</text>
  <text class="note" x="610" y="210" text-anchor="middle">reads fused data, priority 3</text>

  <!-- mutex example -->
  <rect class="q" x="340" y="330" width="120" height="40"/>
  <text class="note" x="400" y="354" text-anchor="middle">Mutex (I2C bus)</text>
  <path class="arrow" d="M270 352 H340"/>
  <path class="arrow" d="M460 352 H520" stroke-dasharray="4 3"/>
  <text class="note" x="605" y="345" text-anchor="middle">shared with Sensor Fusion —</text>
  <text class="note" x="605" y="360" text-anchor="middle">use priority inheritance to</text>
  <text class="note" x="605" y="375" text-anchor="middle">avoid priority inversion</text>

  <text class="note" x="20" y="425">Rule of thumb: keep ISRs short, give hard-real-time work the highest task priority, and never let a low-priority task hold a resource a high-priority task needs without priority inheritance.</text>
</svg>
