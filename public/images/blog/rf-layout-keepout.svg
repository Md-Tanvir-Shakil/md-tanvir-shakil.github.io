<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#14181f;font-size:19px;font-weight:700}
    .sub{fill:#565e6c;font-size:12.5px}
    .lbl{fill:#14181f;font-size:12.5px;font-weight:600}
    .note{fill:#565e6c;font-size:11.5px}
    .board{fill:#f7f8fa;stroke:#565e6c;stroke-width:1.5}
    .gnd{fill:#e5f0f1;stroke:#1f5f6b;stroke-width:1}
    .keepout{fill:none;stroke:#c0392b;stroke-width:1.5;stroke-dasharray:6 4}
    .module{fill:#dfe3e8;stroke:#14181f;stroke-width:1.5}
    .antenna{stroke:#1f5f6b;stroke-width:3;fill:none}
    .dim{stroke:#565e6c;stroke-width:1}
    .arrow{fill:#565e6c}
  </style>
  <rect class="bg" width="800" height="460"/>
  <text class="title" x="20" y="30">RF Keepout &amp; Ground-Plane Layout for an ESP32 Module</text>
  <text class="sub" x="20" y="48">Top-down PCB view — antenna edge of the module must stay clear of copper, plane, and enclosure metal</text>

  <!-- board -->
  <rect class="board" x="60" y="80" width="680" height="340"/>

  <!-- ground plane hatch fill under most of board -->
  <rect class="gnd" x="60" y="80" width="680" height="340" opacity="0.5"/>

  <!-- module -->
  <rect class="module" x="500" y="150" width="180" height="90"/>
  <text class="lbl" x="590" y="200" text-anchor="middle">ESP32 Module</text>

  <!-- antenna trace -->
  <path class="antenna" d="M680 165 L 740 165 Q 760 165 760 185 L 760 210"/>
  <text class="lbl" x="712" y="150" text-anchor="middle">PCB / chip antenna</text>

  <!-- keepout zone -->
  <rect class="keepout" x="690" y="90" width="100" height="240"/>
  <text class="note" x="740" y="345" text-anchor="middle" fill="#c0392b">No copper, no</text>
  <text class="note" x="740" y="358" text-anchor="middle" fill="#c0392b">ground pour,</text>
  <text class="note" x="740" y="371" text-anchor="middle" fill="#c0392b">no metal shield</text>
  <text class="note" x="740" y="384" text-anchor="middle" fill="#c0392b">in this zone</text>

  <!-- dimension line for keepout -->
  <line class="dim" x1="690" y1="425" x2="790" y2="425"/>
  <line class="dim" x1="690" y1="420" x2="690" y2="430"/>
  <line class="dim" x1="790" y1="420" x2="790" y2="430"/>
  <text class="note" x="740" y="440" text-anchor="middle">≥ 10–15 mm clearance (check module datasheet)</text>

  <!-- solid ground pour region label -->
  <text class="lbl" x="260" y="120">Solid unbroken ground plane (layer 2)</text>
  <text class="note" x="260" y="136">No slots or splits under RF / crystal / power sections</text>

  <!-- crystal / power kept away from antenna -->
  <rect x="90" y="160" width="60" height="34" fill="#dfe3e8" stroke="#14181f" stroke-width="1"/>
  <text class="note" x="120" y="181" text-anchor="middle" font-size="10.5">Crystal</text>

  <rect x="90" y="220" width="90" height="40" fill="#dfe3e8" stroke="#14181f" stroke-width="1"/>
  <text class="note" x="135" y="244" text-anchor="middle" font-size="10.5">Switching PSU</text>

  <path class="antenna" d="M180 240 L 260 240" stroke-dasharray="2 4" opacity="0.5"/>
  <text class="note" x="270" y="244" font-size="11">Route noisy switching nets away from antenna edge</text>

  <!-- via stitching along board edge for shielding -->
  <g fill="#14181f">
    <circle cx="70" cy="90" r="2.5"/><circle cx="70" cy="120" r="2.5"/><circle cx="70" cy="150" r="2.5"/>
    <circle cx="70" cy="350" r="2.5"/><circle cx="70" cy="380" r="2.5"/><circle cx="70" cy="410" r="2.5"/>
  </g>
  <text class="note" x="20" y="440">Via-stitch the board edge to ground every λ/20 to suppress edge radiation</text>
</svg>
