name: PR Content & Build Check

# Runs on every pull request (including ones opened by Decap CMS's editorial
# workflow) so a bad content edit or code change is caught before merge, without
# deploying anything.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content & type-check
        run: npm run check

      - name: Build (does not deploy)
        run: npm run build
